; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Polybar — Cyber Red & Black theme
; cyber red #FF0033 · deep black #0A0000
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[colors]
bg      = #0A0000
bg-mod  = #150000
bg-hi   = #220000
fg      = #F0CCCC
dim     = #662222
accent  = #FF0033
icon    = #FFFFFF
red     = #FF0000

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; BAR
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[bar/main]
width          = 100%
height         = 24pt
offset-x       = 0
offset-y       = 0
radius         = 0

background     = ${colors.bg}
foreground     = ${colors.fg}

line-size      = 0
border-size    = 0

padding-left   = 1
padding-right  = 1
module-margin  = 0

; font-0: text   font-1: bold   font-2: nerd icons at larger size to prevent clipping
font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2
font-2 = JetBrainsMono Nerd Font:size=12;4

modules-left   = i3 sep xwindow
modules-center =
modules-right  = vpn sep cpu sep memory sep disk sep net-ip sep net-speed sep temp sep pulseaudio sep battery sep date-time

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true
wm-restack    = i3

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; SEPARATOR
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/sep]
type              = custom/text
format            = " | "
format-foreground = ${colors.dim}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; WORKSPACES
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/i3]
type            = internal/i3
pin-workspaces  = false
show-urgent     = true
index-sort      = true
enable-click    = true
enable-scroll   = false

label-focused            = " %name% "
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.accent}
label-focused-padding    = 0

label-occupied            = " %name% "
label-occupied-foreground = ${colors.fg}
label-occupied-background = ${colors.bg-hi}
label-occupied-padding    = 0

label-urgent            = " %name% "
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding    = 0

label-empty            = " %name% "
label-empty-foreground = ${colors.dim}
label-empty-padding    = 0

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; WINDOW TITLE
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/xwindow]
type             = internal/xwindow
label            = %title:0:50:…%
label-foreground = ${colors.fg}
label-padding    = 1

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; DATE   nf-md-calendar_month
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/date-day]
type              = internal/date
interval          = 60
date              = %a %d %b
date-alt          = %Y-%m-%d
format            = <label>
format-background = ${colors.bg-mod}
format-padding    = 1
label             = %{T3}%{F#FFFFFF}󰃭%{F-}%{T-}  %date%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; TIME   nf-md-clock_outline
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/date-time]
type              = internal/date
interval          = 1
time              = %H:%M
time-alt          = %H:%M:%S
format            = <label>
format-background = ${colors.bg-mod}
format-padding    = 1
label             = %{T3}%{F#FFFFFF}󰥔%{F-}%{T-}  %time%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; HTB TARGET   nf-md-crosshairs_gps
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/htb]
type              = custom/script
exec              = ~/.config/polybar/scripts/htb-status.sh
interval          = 10
format-background = ${colors.bg-mod}
format-padding    = 1
click-left        = alacritty -e bash -c "read -p 'Target (name ip): ' t && echo $$t > ~/.config/pentest/target && echo Saved && sleep 1"

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; VPN   nf-md-shield_check / nf-md-shield_off
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/vpn]
type              = custom/script
exec              = ~/.config/polybar/scripts/vpn-status.sh
interval          = 5
format-background = ${colors.bg-mod}
format-padding    = 1

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; CPU   nf-md-cpu_64_bit
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/cpu]
type              = internal/cpu
interval          = 2
format            = <label>
format-prefix     = "%{T3}%{F#FFFFFF}󰻠%{F-}%{T-}  "
format-background = ${colors.bg-mod}
format-padding    = 1
label             = %percentage:2%%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; MEMORY   nf-md-memory
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/memory]
type              = internal/memory
interval          = 2
format            = <label>
format-prefix     = "%{T3}%{F#FFFFFF}󰍛%{F-}%{T-}  "
format-background = ${colors.bg-mod}
format-padding    = 1
label             = %percentage_used:2%%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; DISK   nf-md-harddisk
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/disk]
type              = internal/fs
mount-0           = /
interval          = 30
fixed-values      = false
format-mounted            = <label-mounted>
format-mounted-prefix     = "%{T3}%{F#FFFFFF}󰋊%{F-}%{T-}  "
format-mounted-background = ${colors.bg-mod}
format-mounted-padding    = 1
label-mounted             = %percentage_used:2%%
label-mounted-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; NETWORK IP   nf-md-ip_network / nf-md-wifi_off
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/net-ip]
type           = internal/network
interface-type = wireless
interval       = 5

format-connected            = <label-connected>
format-connected-padding    = 1
format-connected-background = ${colors.bg-mod}

format-disconnected            = <label-disconnected>
format-disconnected-padding    = 1
format-disconnected-background = ${colors.bg-mod}

label-connected            = %{T3}%{F#FFFFFF}󰩟%{F-}%{T-}  %local_ip%
label-connected-foreground = ${colors.fg}

label-disconnected            = %{T3}%{F#FFFFFF}󰖪%{F-}%{T-}  offline
label-disconnected-foreground = ${colors.dim}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; NETWORK SPEED   nf-md-arrow_down_bold / nf-md-arrow_up_bold
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/net-speed]
type           = internal/network
interface-type = wireless
interval       = 2

format-connected            = <label-connected>
format-connected-padding    = 1
format-connected-background = ${colors.bg-mod}

format-disconnected = ""

label-connected            = %{T3}%{F#FFFFFF}󰁆%{F-}%{T-}  %downspeed:6%  %{T3}%{F#FFFFFF}󰁞%{F-}%{T-}  %upspeed:6%
label-connected-foreground = ${colors.fg}

[module/wlan-fallback]
type           = internal/network
interface-type = wireless
interval       = 2

format-connected            = <label-connected>
format-connected-padding    = 1
format-connected-background = ${colors.bg-mod}

format-disconnected = ""

label-connected            = %{T3}%{F#FFFFFF}󰤨%{F-}%{T-}  %essid%  %{T3}%{F#FFFFFF}󰁆%{F-}%{T-}  %downspeed:6%
label-connected-foreground = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; TEMPERATURE   nf-md-thermometer
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/temp]
type              = internal/temperature
interval          = 5
thermal-zone      = 0
base-temperature  = 20
warn-temperature  = 80

format            = <ramp> <label>
format-background = ${colors.bg-mod}
format-padding    = 1

format-warn            = <ramp> <label-warn>
format-warn-background = ${colors.bg-mod}
format-warn-padding    = 1

label                 = %temperature-c%
label-warn            = %temperature-c%
label-warn-foreground = ${colors.red}

ramp-0            = %{T3}%{F#FFFFFF}󰔏%{F-}%{T-}
ramp-1            = %{T3}%{F#FFFFFF}󰔏%{F-}%{T-}
ramp-2            = %{T3}%{F#FFFFFF}󰈸%{F-}%{T-}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; PULSEAUDIO   nf-md-volume_high / nf-md-volume_mute
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/pulseaudio]
type       = internal/pulseaudio
use-ui-max = false

format-volume            = <ramp-volume> <label-volume>
format-volume-background = ${colors.bg-mod}
format-volume-padding    = 1

format-muted            = <label-muted>
format-muted-background = ${colors.bg-mod}
format-muted-padding    = 1

label-volume            = %percentage%%
label-volume-foreground = ${colors.fg}

label-muted            = %{T3}%{F#FFFFFF}󰝟%{F-}%{T-}  mute
label-muted-foreground = ${colors.dim}

ramp-volume-0            = %{T3}%{F#FFFFFF}󰕿%{F-}%{T-}
ramp-volume-1            = %{T3}%{F#FFFFFF}󰖀%{F-}%{T-}
ramp-volume-2            = %{T3}%{F#FFFFFF}󰕾%{F-}%{T-}

click-right = pavucontrol &

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; BATTERY   nf-md-battery_* levels   nf-md-lightning_bolt charging
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = ACAD
full-at       = 98
poll-interval = 5

format-charging            = <animation-charging> <label-charging>
format-charging-background = ${colors.bg-mod}
format-charging-padding    = 1

format-discharging            = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.bg-mod}
format-discharging-padding    = 1

format-full            = <label-full>
format-full-background = ${colors.bg-mod}
format-full-padding    = 1

label-charging    = %percentage%%
label-discharging = %percentage%%
label-full        = %{T3}%{F#FFFFFF}󰂄%{F-}%{T-}  full

ramp-capacity-0 = %{T3}%{F#FFFFFF}󰁺%{F-}%{T-}
ramp-capacity-1 = %{T3}%{F#FFFFFF}󰁼%{F-}%{T-}
ramp-capacity-2 = %{T3}%{F#FFFFFF}󰁾%{F-}%{T-}
ramp-capacity-3 = %{T3}%{F#FFFFFF}󰂀%{F-}%{T-}
ramp-capacity-4 = %{T3}%{F#FFFFFF}󰂂%{F-}%{T-}

animation-charging-0 = %{T3}%{F#FFFFFF}󰢜%{F-}%{T-}
animation-charging-1 = %{T3}%{F#FFFFFF}󰂆%{F-}%{T-}
animation-charging-2 = %{T3}%{F#FFFFFF}󰂈%{F-}%{T-}
animation-charging-3 = %{T3}%{F#FFFFFF}󰂊%{F-}%{T-}
animation-charging-4 = %{T3}%{F#FFFFFF}󰂅%{F-}%{T-}
animation-charging-foreground = ${colors.icon}
animation-charging-framerate  = 750

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
