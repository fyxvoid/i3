; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Polybar — Chopper theme
; sky blue #5BBAD6 · hat pink #E87DA0 · dark ocean #1C2B35
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[colors]
bg      = #1C2B35
bg-mod  = #243545
bg-hi   = #2E4A62
fg      = #D8EEF8
dim     = #4A7080
accent  = #E87DA0
green   = #6ED9A0
yellow  = #F0C040
orange  = #F49040
magenta = #C07AB8
blue    = #5BBAD6
cyan    = #40C4C8
red     = #E85868

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; BAR
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[bar/main]
width          = 100%
height         = 28pt
offset-x       = 0
offset-y       = 0
radius         = 0

background     = ${colors.bg}
foreground     = ${colors.fg}

line-size      = 2pt
border-size    = 0

padding-left   = 1
padding-right  = 1
module-margin  = 0

font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;3
font-2 = JetBrainsMono Nerd Font:style=Regular:size=10;3

modules-left   = i3 sep xwindow sep chopper
modules-center =
modules-right  = vpn sep cpu sep memory sep disk sep net-ip sep net-speed sep temp sep pulseaudio sep battery sep date-time

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true
wm-restack    = i3

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; SEPARATOR
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/sep]
type              = custom/text
format            = " | "
format-foreground = ${colors.dim}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; WORKSPACES
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/i3]
type            = internal/i3
pin-workspaces  = false
show-urgent     = true
index-sort      = true
enable-click    = true
enable-scroll   = false

label-focused            = " %name% "
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.accent}
label-focused-underline  = ${colors.accent}
label-focused-padding    = 0

label-occupied            = " %name% "
label-occupied-foreground = ${colors.fg}
label-occupied-background = ${colors.bg-hi}
label-occupied-underline  = ${colors.blue}
label-occupied-padding    = 0

label-urgent            = " %name% "
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding    = 0

label-empty            = " %name% "
label-empty-foreground = ${colors.dim}
label-empty-padding    = 0

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; CHOPPER — aesthetic One Piece mascot
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/chopper]
type              = custom/text
format            = " 󰾷 "
format-foreground = #E87DA0
format-background = ${colors.bg-mod}
format-underline  = #E87DA0

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; WINDOW TITLE
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/xwindow]
type             = internal/xwindow
label            = %title:0:50:…%
label-foreground = ${colors.dim}
label-padding    = 1

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; DATE  (center left) — underline: blue
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/date-day]
type              = internal/date
interval          = 60
date              = %a %d %b
date-alt          = %Y-%m-%d
format            = <label>
format-background = ${colors.bg-mod}
format-padding    = 1
format-underline  = ${colors.blue}
label             = %{F#5BBAD6}%{T2}󰃮%{T-}%{F-} %date%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; TIME  (center right) — underline: pink
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/date-time]
type              = internal/date
interval          = 1
time              = %H:%M
time-alt          = %H:%M:%S
format            = <label>
format-background = ${colors.bg-mod}
format-padding    = 1
format-underline  = ${colors.accent}
label             = %{F#E87DA0}󱞫%{F-}  %time%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; HTB TARGET — underline: pink
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/htb]
type              = custom/script
exec              = ~/.config/polybar/scripts/htb-status.sh
interval          = 10
format-background = ${colors.bg-mod}
format-padding    = 1
format-underline  = ${colors.accent}
click-left        = alacritty -e bash -c "read -p 'Target (name ip): ' t && echo $$t > ~/.config/pentest/target && echo Saved && sleep 1"

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; VPN — underline: green
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/vpn]
type              = custom/script
exec              = ~/.config/polybar/scripts/vpn-status.sh
interval          = 5
format-background = ${colors.bg-mod}
format-padding    = 1
format-underline  = ${colors.green}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; CPU — underline: magenta
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/cpu]
type              = internal/cpu
interval          = 2
format            = <label>
format-prefix     = "%{F#C07AB8}󰘚%{F-}  "
format-background = ${colors.bg-mod}
format-padding    = 1
format-underline  = ${colors.magenta}
label             = %percentage:2%%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; MEMORY — underline: yellow
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/memory]
type              = internal/memory
interval          = 2
format            = <label>
format-prefix     = "%{F#F0C040}󱐋%{F-}  "
format-background = ${colors.bg-mod}
format-padding    = 1
format-underline  = ${colors.yellow}
label             = %percentage_used:2%%
label-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; DISK — underline: orange
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/disk]
type              = internal/fs
mount-0           = /
interval          = 30
fixed-values      = false
format-mounted            = <label-mounted>
format-mounted-prefix     = "%{F#F49040}󱗢%{F-}  "
format-mounted-background = ${colors.bg-mod}
format-mounted-padding    = 1
format-mounted-underline  = ${colors.orange}
label-mounted             = %percentage_used:2%%
label-mounted-foreground  = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; NETWORK IP — underline: blue
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/net-ip]
type           = internal/network
interface-type = wireless
interval       = 5

format-connected            = <label-connected>
format-connected-padding    = 1
format-connected-background = ${colors.bg-mod}
format-connected-underline  = ${colors.blue}

format-disconnected            = <label-disconnected>
format-disconnected-padding    = 1
format-disconnected-background = ${colors.bg-mod}

label-connected            = %{F#5BBAD6}󰆩%{F-}  %local_ip%
label-connected-foreground = ${colors.fg}

label-disconnected            = %{F#4A7080}󰤮%{F-}  offline
label-disconnected-foreground = ${colors.dim}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; NETWORK SPEED — underline: green
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/net-speed]
type           = internal/network
interface-type = wireless
interval       = 2

format-connected            = <label-connected>
format-connected-padding    = 1
format-connected-background = ${colors.bg-mod}
format-connected-underline  = ${colors.green}

format-disconnected = ""

label-connected            = %{F#6ED9A0}󰇚%{F-}  %downspeed:6%  %{F#F0C040}󰆜%{F-}  %upspeed:6%
label-connected-foreground = ${colors.fg}

[module/wlan-fallback]
type           = internal/network
interface-type = wireless
interval       = 2

format-connected            = <label-connected>
format-connected-padding    = 1
format-connected-background = ${colors.bg-mod}
format-connected-underline  = ${colors.blue}

format-disconnected = ""

label-connected            = %{F#5BBAD6}%{T2}󰤨%{T-}%{F-} %essid% %{F#6ED9A0}%{T2}󰁅%{T-}%{F-}%downspeed:6%
label-connected-foreground = ${colors.fg}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; TEMPERATURE — underline: orange
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/temp]
type              = internal/temperature
interval          = 5
thermal-zone      = 0
base-temperature  = 20
warn-temperature  = 80

format            = <ramp> <label>
format-background = ${colors.bg-mod}
format-padding    = 1
format-underline  = ${colors.orange}

format-warn            = <ramp> <label-warn>
format-warn-background = ${colors.bg-mod}
format-warn-padding    = 1
format-warn-underline  = ${colors.red}

label                 = %temperature-c%
label-warn            = %temperature-c%
label-warn-foreground = ${colors.red}

ramp-0            = 󱃃
ramp-1            = 󰔏
ramp-2            = 󰈸
ramp-0-foreground = ${colors.blue}
ramp-1-foreground = ${colors.yellow}
ramp-2-foreground = ${colors.red}

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; PULSEAUDIO — underline: cyan
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/pulseaudio]
type       = internal/pulseaudio
use-ui-max = false

format-volume            = <ramp-volume> <label-volume>
format-volume-background = ${colors.bg-mod}
format-volume-padding    = 1
format-volume-underline  = ${colors.cyan}

format-muted            = <label-muted>
format-muted-background = ${colors.bg-mod}
format-muted-padding    = 1
format-muted-underline  = ${colors.cyan}

label-volume            = %percentage%%
label-volume-foreground = ${colors.fg}

label-muted            = 󰝟  mute
label-muted-foreground = ${colors.dim}

ramp-volume-0            = 󰕿
ramp-volume-1            = 󰖀
ramp-volume-2            = 󰕾
ramp-volume-0-foreground = ${colors.cyan}
ramp-volume-1-foreground = ${colors.cyan}
ramp-volume-2-foreground = ${colors.cyan}

click-right = pavucontrol &

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; BATTERY — underline: green (charging) / yellow (discharging)
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = ACAD
full-at       = 98
poll-interval = 5

format-charging            = <animation-charging> <label-charging>
format-charging-background = ${colors.bg-mod}
format-charging-padding    = 1
format-charging-underline  = ${colors.green}

format-discharging            = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.bg-mod}
format-discharging-padding    = 1
format-discharging-underline  = ${colors.yellow}

format-full            = <label-full>
format-full-background = ${colors.bg-mod}
format-full-padding    = 1
format-full-underline  = ${colors.green}

label-charging    = %percentage%%
label-discharging = %percentage%%
label-full        = %{F#6ED9A0}󰁹%{F-}  full

ramp-capacity-0            = 󰁺
ramp-capacity-1            = 󰁼
ramp-capacity-2            = 󰁾
ramp-capacity-3            = 󰂀
ramp-capacity-4            = 󰂂
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.orange}
ramp-capacity-2-foreground = ${colors.yellow}
ramp-capacity-3-foreground = ${colors.green}
ramp-capacity-4-foreground = ${colors.green}

animation-charging-0          = 󰢜
animation-charging-1          = 󰂆
animation-charging-2          = 󰂈
animation-charging-3          = 󰂊
animation-charging-4          = 󰂅
animation-charging-foreground = ${colors.green}
animation-charging-framerate  = 750

