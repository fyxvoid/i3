# i3status config — Dark Edition
# Installed to ~/.config/i3/i3status.conf, referenced by i3/config's bar block.

general {
    output_format  = "i3bar"
    colors         = true
    markup         = "pango"
    interval       = 5
    color_good     = "#00d4d4"
    color_degraded = "#f9e2af"
    color_bad      = "#f38ba8"
}

order += "cpu_usage"
order += "memory"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "load"
order += "tztime local"

cpu_usage {
    format             = "<span foreground='#7ed321'>CPU</span> %usage"
    degraded_threshold = 60
    max_threshold      = 85
}

memory {
    format            = "<span foreground='#7ed321'>RAM</span> %used / %total"
    threshold_degraded = "1G"
    format_degraded   = "<span foreground='#f38ba8'>RAM LOW</span> %available"
}

disk "/" {
    format = "<span foreground='#7ed321'>DISK</span> %avail"
}

wireless _first_ {
    format_up   = "<span foreground='#7ed321'>WIFI</span> <span foreground='#89b4fa'>%essid</span> (<span foreground='#cba6f7'>%quality</span>)"
    format_down = "<span foreground='#45475a'>WIFI</span> down"
}

ethernet _first_ {
    format_up   = "<span foreground='#00d4d4'>ETH</span> %ip (%speed)"
    format_down = ""
}

battery all {
    format                    = "<span foreground='#7ed321'>BAT</span> %status %percentage"
    format_down               = ""
    last_full_capacity        = true
    integer_battery_capacity  = true
}

load {
    format = "<span foreground='#7ed321'>LOAD</span> %1min"
}

tztime local {
    format = "<span foreground='#7ed321'>TIME</span> %Y-%m-%d %H:%M:%S  "
}
