################################
#  Picom — Dark Edition
#  Tested with picom 11+ (pijulius/jonaburg fork or upstream)
################################

# ── Backend ──────────────────────────────────────────────────
backend    = "glx";
vsync      = true;
use-damage = true;

# ── Rounded Corners — disabled ───────────────────────────────
corner-radius = 0;

# ── Shadows ──────────────────────────────────────────────────
shadow              = true;
shadow-radius       = 14;
shadow-opacity      = 0.4;
shadow-offset-x     = -8;
shadow-offset-y     = -8;
shadow-color        = "#000000";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'dmenu'",
    "_GTK_FRAME_EXTENTS@",
    "window_type = 'menu'",
    "window_type = 'tooltip'",
    "window_type = 'dock'"
];

# ── Fading ───────────────────────────────────────────────────
fading          = true;
fade-in-step    = 0.04;
fade-out-step   = 0.04;
fade-delta      = 5;

fade-exclude = [
    "class_g = 'slop'"
];

# ── Opacity ──────────────────────────────────────────────────
# Transparency applies everywhere by default (focused or not);
# browsers are pinned to 100% below so content stays readable.
active-opacity          = 0.90;
inactive-opacity        = 0.80;
inactive-opacity-override = false;
frame-opacity           = 0.92;

opacity-rule = [
    "96:class_g = 'Alacritty' && focused",
    "72:class_g = 'Alacritty' && !focused",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "96:class_g = 'Code'",
    "85:class_g = 'Thunar'",
    "100:window_type = 'dialog'",
    "100:window_type = 'popup_menu'"
];

# ── Blur ─────────────────────────────────────────────────────
blur-method         = "dual_kawase";
blur-strength       = 1;
blur-background     = true;
blur-background-fixed = false;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── General ──────────────────────────────────────────────────
mark-wmwin-focused      = true;
mark-ovredir-focused    = true;
detect-rounded-corners  = true;
detect-client-opacity   = true;
detect-transient        = true;
detect-client-leader    = true;
log-level               = "warn";
